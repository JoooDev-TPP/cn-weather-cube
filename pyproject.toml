[project]
name = "cn-weather-cube"
version = "0.1.0"
description = "Point weather for renewable-energy work, with units attached and sources named"
requires-python = ">=3.10"
authors = [{ name = "Haohang Zhao" }]
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "pyarrow>=14", "numpy>=1.24"]

[project.optional-dependencies]
features = ["pvlib>=0.11"]
area = ["xarray>=2024.1", "zarr>=2.16", "gcsfs>=2024.2"]
dev = ["pytest>=8.0"]

[project.scripts]
cube = "cube.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
