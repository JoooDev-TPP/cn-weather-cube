name: tests
# This package's claim is that a number it hands you carries its unit and its
# source.  A stranger can only check that by installing it from pyproject.toml
# alone and running the suite, so that is what runs here, on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]   # the floor in requires-python, and current
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ matrix.python-version }}" }
      - name: install from pyproject only
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,features,opendata]"
      - run: python -m pytest -q
